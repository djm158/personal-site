<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rider</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; line-height: 0">
<svg viewBox="0 0 160 100" width="{{w}}" height="{{h}}" role="img" aria-label="Dan riding a bike">
<sc-if value="{{night}}" hint-placeholder-val="{{ false }}">
<polygon points="92,36 160,18 160,62" style="fill: oklch(0.95 0.09 95); opacity: 0.32"></polygon>
<polygon points="92,36 160,28 160,48" style="fill: oklch(0.97 0.07 95); opacity: 0.4"></polygon>
</sc-if>
<g>
<circle cx="26" cy="73" r="21" style="fill: none; stroke: {{p.ink}}; stroke-width: 3"></circle>
<g transform="rotate({{wheel}} 26 73)">
<line x1="26" y1="53" x2="26" y2="93" style="stroke: {{p.muted}}; stroke-width: 0.9"></line>
<line x1="8.7" y1="63" x2="43.3" y2="83" style="stroke: {{p.muted}}; stroke-width: 0.9"></line>
<line x1="8.7" y1="83" x2="43.3" y2="63" style="stroke: {{p.muted}}; stroke-width: 0.9"></line>
</g>
<circle cx="26" cy="73" r="2.2" style="fill: {{p.ink}}"></circle>
</g>
<g>
<circle cx="94" cy="73" r="21" style="fill: none; stroke: {{p.ink}}; stroke-width: 3"></circle>
<g transform="rotate({{wheel}} 94 73)">
<line x1="94" y1="53" x2="94" y2="93" style="stroke: {{p.muted}}; stroke-width: 0.9"></line>
<line x1="76.7" y1="63" x2="111.3" y2="83" style="stroke: {{p.muted}}; stroke-width: 0.9"></line>
<line x1="76.7" y1="83" x2="111.3" y2="63" style="stroke: {{p.muted}}; stroke-width: 0.9"></line>
</g>
<circle cx="94" cy="73" r="2.2" style="fill: {{p.ink}}"></circle>
</g>
<path d="{{farThigh}}" style="fill: none; stroke: {{p.shortsFar}}; stroke-width: 6.5; stroke-linecap: round"></path>
<path d="{{farShin}}" style="fill: none; stroke: {{p.skin2}}; stroke-width: 4.6; stroke-linecap: round"></path>
<path d="{{farShoe}}" style="fill: none; stroke: {{p.shoe}}; stroke-width: 3.6; stroke-linecap: round"></path>
<path d="M26 73 L54 71 L44 43 Z M44 43 L84 42 L86 53 L54 71 M86 53 L94 73" style="fill: none; stroke: {{p.accent}}; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round"></path>
<path d="M44 43 L43 38" style="stroke: {{p.accent}}; stroke-width: 3; stroke-linecap: round"></path>
<path d="M37 37 L50 37" style="stroke: {{p.ink}}; stroke-width: 3.4; stroke-linecap: round"></path>
<path d="M84 42 L87 35 Q95 34 93 42" style="fill: none; stroke: {{p.ink}}; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"></path>
<circle cx="54" cy="71" r="5.2" style="fill: none; stroke: {{p.muted}}; stroke-width: 1.6"></circle>
<path d="{{crankLine}}" style="stroke: {{p.ink}}; stroke-width: 2.4; stroke-linecap: round"></path>
<path d="M45 37 L69 20" style="stroke: {{p.moss}}; stroke-width: 12; stroke-linecap: round"></path>
<path d="{{nearThigh}}" style="fill: none; stroke: {{p.shorts}}; stroke-width: 7; stroke-linecap: round"></path>
<path d="{{nearShin}}" style="fill: none; stroke: {{p.skin}}; stroke-width: 5; stroke-linecap: round"></path>
<path d="{{nearShoe}}" style="fill: none; stroke: {{p.shoe}}; stroke-width: 4; stroke-linecap: round"></path>
<path d="M72 15.2 L77.6 17.4 L75.2 22.6 L68.4 21 Z" style="fill: {{p.skin2}}"></path>
<path d="M67.8 21.2 Q71.6 23.8 75.8 22.6" style="fill: none; stroke: {{p.collar}}; stroke-width: 2.6; stroke-linecap: round"></path>
<path d="M69 21 L77 30" style="stroke: {{p.moss}}; stroke-width: 5.5; stroke-linecap: round"></path>
<path d="M77 30 L87 35" style="stroke: {{p.skin}}; stroke-width: 4; stroke-linecap: round"></path>
<circle cx="77" cy="10.5" r="7.6" style="fill: {{p.skin}}"></circle>
<path d="M68.4 8.8 Q67.6 13.6 71 16.4 L72.8 14.8 Q70.9 12.6 71.6 9.2 Z" style="fill: {{p.hair}}"></path>
<path d="M70.5 12.5 Q71 19.8 78 19.4 Q84.4 18.6 84.8 13 Q80 15.6 75.5 14.4 Q72.5 13.6 70.5 12.5 Z" style="fill: {{p.hair}}"></path>
<ellipse cx="73.6" cy="11.4" rx="1.9" ry="2.3" style="fill: {{p.skin2}}"></ellipse>
<circle cx="81.6" cy="9.6" r="2.7" style="fill: none; stroke: {{p.frames}}; stroke-width: 1.3"></circle>
<path d="M78.9 9.2 L72.6 8.4" style="stroke: {{p.frames}}; stroke-width: 1.1"></path>
<path d="M68.4 9.2 Q69.6 0.6 78.6 0.8 Q86.4 1.4 86.6 7.6 Q84.6 6.4 79 6.6 Q73 7 68.4 9.2 Z" style="fill: {{p.helmet}}"></path>
<sc-if value="{{night}}" hint-placeholder-val="{{ false }}">
<circle cx="91" cy="36" r="2.2" style="fill: oklch(0.97 0.07 95)"></circle>
</sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"crank":{"editor":"range","min":0,"max":359,"step":1,"default":51},"wheel":{"editor":"range","min":0,"max":359,"step":1,"default":0},"night":{"editor":"boolean","default":false},"size":{"editor":"int","default":240},"$preview":{"width":240,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size ?? 240) || 240;
    const night = this.props.night === true || this.props.night === 'true';
    const crank = (Number(this.props.crank ?? 30) || 0) * Math.PI / 180;
    const wheel = (Number(this.props.wheel ?? 0) || 0).toFixed(1);
    const day = {
      ink: 'oklch(0.25 0.025 50)', muted: 'oklch(0.46 0.025 55)', accent: 'oklch(0.52 0.12 42)',
      moss: 'oklch(0.55 0.08 130)', shorts: 'oklch(0.25 0.025 50)', shortsFar: 'oklch(0.38 0.025 50)',
      shoe: 'oklch(0.25 0.025 50)', helmet: 'oklch(0.25 0.025 50)', frames: 'oklch(0.5 0.02 60)'
    };
    const dark = {
      ink: 'oklch(0.93 0.015 80)', muted: 'oklch(0.74 0.02 70)', accent: 'oklch(0.74 0.12 42)',
      moss: 'oklch(0.68 0.08 130)', shorts: 'oklch(0.36 0.02 55)', shortsFar: 'oklch(0.3 0.02 55)',
      shoe: 'oklch(0.93 0.015 80)', helmet: 'oklch(0.93 0.015 80)', frames: 'oklch(0.3 0.02 55)'
    };
    const p = Object.assign({
      hair: 'oklch(0.6 0.145 42)', skin: 'oklch(0.88 0.045 65)', skin2: 'oklch(0.8 0.06 55)',
      collar: night ? 'oklch(0.56 0.08 130)' : 'oklch(0.45 0.08 130)'
    }, night ? dark : day);
    // Two-bone leg from the hip to a pedal; the knee bends forward
    const hip = [46, 37];
    const bb = [54, 71];
    const crankLen = 9;
    const leg = (angle) => {
      const foot = [bb[0] + crankLen * Math.cos(angle), bb[1] + crankLen * Math.sin(angle)];
      const dx = foot[0] - hip[0];
      const dy = foot[1] - hip[1];
      const seg = 21;
      const d = Math.min(Math.hypot(dx, dy), seg * 2 - 0.01);
      const base = Math.atan2(dy, dx);
      const bend = Math.acos(d / (2 * seg));
      const knee = [hip[0] + seg * Math.cos(base - bend), hip[1] + seg * Math.sin(base - bend)];
      const f = (n) => n.toFixed(2);
      return {
        thigh: 'M' + f(hip[0]) + ' ' + f(hip[1]) + ' L' + f(knee[0]) + ' ' + f(knee[1]),
        shin: 'M' + f(knee[0]) + ' ' + f(knee[1]) + ' L' + f(foot[0]) + ' ' + f(foot[1]),
        shoe: 'M' + f(foot[0] - 2.5) + ' ' + f(foot[1] + 1) + ' L' + f(foot[0] + 5) + ' ' + f(foot[1] + 1),
        foot
      };
    };
    const near = leg(crank);
    const far = leg(crank + Math.PI);
    const crankLine = 'M' + far.foot[0].toFixed(2) + ' ' + far.foot[1].toFixed(2) + ' L' + near.foot[0].toFixed(2) + ' ' + near.foot[1].toFixed(2);

    return {
      w: size, h: Math.round(size * 100 / 160), night, wheel, p, crankLine,
      nearThigh: near.thigh, nearShin: near.shin, nearShoe: near.shoe,
      farThigh: far.thigh, farShin: far.shin, farShoe: far.shoe
    };
  }
}
</script>
</body>
</html>
