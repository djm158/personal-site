name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run for the push before it
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The build makes resume.pdf with Typst. Use the same version as the Netlify build,
      # read from netlify.toml so there's one place to change it.
      - name: Install Typst
        run: |
          version=$(sed -n 's/^ *TYPST_VERSION *= *"\(.*\)"/\1/p' netlify.toml)
          test -n "$version" || { echo "TYPST_VERSION not found in netlify.toml"; exit 1; }
          mkdir -p .bin
          curl -fsSL "https://github.com/typst/typst/releases/download/v${version}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C .bin --strip-components=1
          echo "$PWD/.bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test --run
      - run: pnpm build

      # Axe checks run against ./dist, so they go after the build. The browser download is
      # cached per Playwright version; its system libraries aren't, so a cache hit still
      # installs those.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:a11y
