name: Heartbeat rebuild
# Rebuild monthly so date-derived content (years of experience, "Present" durations) stays current.
on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month
  workflow_dispatch:
permissions: {}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST -d '{}' "$HOOK"
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
