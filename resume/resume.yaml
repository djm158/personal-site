    bullets:
      - >-
        Founding engineer who owned the product platform end to end: auth,
        multi-tenant workspaces with RBAC, the core introduction workflow, data
        pipelines and search, and CRM integrations; designed the technical hiring
        process (take-home project with live review) and hired and onboarded two
        engineers.
      - >-
        Scaled network discovery from ~100 to tens of thousands of connections
        per person, with results in under a minute, enabling live sales demos:
        benchmarked graph databases (Neo4j, TigerGraph) against search, then
        built an Elasticsearch pipeline over 700M+ profiles with chunked,
        retryable Inngest jobs and per-workspace concurrency limits.
      - >-
        Added realtime WebSocket notifications (Supabase Realtime) for
        background-job and CRM-sync results: private per-workspace channels
        secured with row-level security, server-only publishing, and batched
        failure alerts.
      - >-
        Led the migration from NextAuth to Better Auth after library workarounds
        caused silent sign-in failures, mapping it onto the existing schema and
        consolidating user tables; added workspace role-based permissions,
        Zod-validated Server Actions, and PostgreSQL row-level security for
        tenant isolation.
      - >-
        Shipped the end-to-end introduction flow in Next.js and TypeScript,
        including connection selection, rich-text email templates, status
        tracking, and delivery through connected Google accounts.
      - >-
        Built the HubSpot integration: CRM list sync, account-owner mapping, and
        introduction paths in HubSpot.

