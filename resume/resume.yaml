        axe,
        eslint-plugin-jsx-a11y,
        Lighthouse,
        Jest,
        Datadog,
        GCP,
        GitHub Actions,
        Git,
        Claude Code,
      ]
    bullets:
      - >-
        Shipped shareable product polls so shoppers could put recommendations to
        a vote among friends, designed end to end: a MySQL schema that enforces
        vote integrity at the database level, a TypeGraphQL API with scoped
        authorization and scheduled poll lifecycle jobs, and React flows with
        guest-viewable share links; Wizard promoted the launch with LinkedIn
        posts and targeted ads.
      - >-
        Built the API and sources drawer that show shoppers the reviews and
        editorials behind each AI recommendation, saving references when chat
        items are created and upgrading legacy items as they were read instead
        of migrating large MongoDB collections.
      - >-
        Led the mobile-to-desktop responsive redesign of the customer app with
        design, introducing a breakpoint system, MobX-backed navigation, and a
        reusable drawer pattern that replaced legacy modals.
      - >-
        Fixed WCAG issues blocking screen reader and keyboard users across
        checkout, chat, product, gallery, and reviews (blocked zoom, off-screen
        content read aloud, keyboard focus) after initiating Lighthouse and
        screen reader audits during the redesign; added accessibility linting to
        the shared ESLint config and shipped static asset compression.
      - >-
        Delivered partner signup and dashboard for a new partner program: React
        flows on a multi-tenant organization model and a GraphQL signup backend
        creating the organization, membership, and retailer claim in one
        transaction.
      - >-
        Wrote the repository's AI assistant instructions (service map,
        data-layer and auth conventions) used for automated Copilot PR review,
        and took part in the team's move to an enterprise Claude Code rollout.

