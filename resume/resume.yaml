summary: >-
  Senior Full-Stack Engineer with 8+ years shipping production web applications
  in TypeScript, React, Next.js, Node.js, and Python. Most recently led the
  responsive redesign, accessibility, and social voting work for an AI-native
  shopping agent; before that, founding engineer owning the data pipeline,
  search, and auth behind an early-stage go-to-market product. Builds daily with
  Claude Code and other agentic tools.

roles:
  - id: wizard
    company: Wizard AI
    title: Staff Software Engineer
    location: Remote
    start: "2026-01"
    end: "2026-09"
    short: Wizard
    blurb: >-
      Shipped social voting from database to UI, led the responsive redesign,
      and drove accessibility fixes across the customer app.
    tags:
      [
        TypeScript,
        React,
        MobX,
        Node.js,
        GraphQL,
        TypeGraphQL,
        MySQL,
        MongoDB,
        HTML,
