<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- The hero face from Avatar.astro, without its eye and mouth behaviour -->
  <!-- Inlined in the page, the theme tokens apply; as the favicon they're undefined, so each falls back to its light value -->
  <defs>
    <clipPath id="avatarMiniClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatarMiniClip)">
    <circle cx="100" cy="100" r="100" fill="var(--color-surface, oklch(0.92 0.024 75))"/>
    <!-- The shirt: the hero clips a rect from y=150 to this ellipse, which starts below 150 and the circle clips at the bottom -->
    <ellipse cx="100" cy="222" rx="90" ry="62" fill="var(--color-moss, oklch(0.55 0.08 130))"/>
    <rect x="84" y="140" width="32" height="34" rx="10" fill="var(--color-skin2, oklch(0.8 0.06 55))"/>
    <rect x="54" y="62" width="20" height="44" rx="9" fill="var(--color-hair, oklch(0.6 0.145 42))"/>
    <rect x="126" y="62" width="20" height="44" rx="9" fill="var(--color-hair, oklch(0.6 0.145 42))"/>
    <circle cx="56" cy="112" r="9" fill="var(--color-skin2, oklch(0.8 0.06 55))"/>
    <circle cx="144" cy="112" r="9" fill="var(--color-skin2, oklch(0.8 0.06 55))"/>
    <ellipse cx="100" cy="106" rx="44" ry="50" fill="var(--color-skin, oklch(0.88 0.045 65))"/>
    <ellipse cx="98" cy="60" rx="50" ry="22" fill="var(--color-hair, oklch(0.6 0.145 42))"/>
    <ellipse cx="112" cy="46" rx="40" ry="19" fill="var(--color-hair, oklch(0.6 0.145 42))" transform="rotate(8 112 46)"/>
    <path d="M80 50 Q104 36 136 44" stroke="var(--color-hair2, oklch(0.48 0.12 38))" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M58 116 Q60 164 100 170 Q140 164 142 116 Q136 136 120 135 Q100 131 80 135 Q64 136 58 116 Z" fill="var(--color-hair, oklch(0.6 0.145 42))"/>
    <path d="M92 146 Q100 151 108 146" stroke="#9C5A4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="66" y="82" width="24" height="5" rx="2.5" fill="var(--color-hair2, oklch(0.48 0.12 38))"/>
    <rect x="110" y="82" width="24" height="5" rx="2.5" fill="var(--color-hair2, oklch(0.48 0.12 38))"/>
    <circle cx="79" cy="110" r="5" fill="#8A6A3E"/>
    <circle cx="121" cy="110" r="5" fill="#8A6A3E"/>
    <circle cx="79" cy="110" r="2.2" fill="var(--color-ink, oklch(0.25 0.025 50))"/>
    <circle cx="121" cy="110" r="2.2" fill="var(--color-ink, oklch(0.25 0.025 50))"/>
    <ellipse cx="100" cy="124" rx="6" ry="4" fill="var(--color-skin2, oklch(0.8 0.06 55))"/>
    <circle cx="79" cy="110" r="17" fill="oklch(1 0 0)" fill-opacity=".14" stroke="oklch(0.5 0.02 60)" stroke-opacity=".85" stroke-width="4.5"/>
    <circle cx="121" cy="110" r="17" fill="oklch(1 0 0)" fill-opacity=".14" stroke="oklch(0.5 0.02 60)" stroke-opacity=".85" stroke-width="4.5"/>
    <path d="M95 106 Q100 101 105 106" stroke="oklch(0.5 0.02 60)" stroke-opacity=".85" stroke-width="4" fill="none"/>
  </g>
</svg>
